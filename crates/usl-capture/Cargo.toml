[package]
name = "usl-capture"
version = "0.1.0"
edition = "2021"
description = "USL capture layer: incremental JSONL line-framing over arbitrary write() boundaries, feeding records into usl-core. FUSE-agnostic; the FUSE mount is a thin adapter over this."
license = "MIT OR Apache-2.0"
repository = "https://github.com/agent-session-protocol/universal-session-log"
homepage = "https://agent-session-protocol.github.io/universal-session-log/"
keywords = ["agent", "session", "capture", "jsonl"]
categories = ["development-tools", "filesystem"]

[dependencies]
usl-core = { version = "0.1.0", path = "../usl-core" }
serde_json = "1"
