[package]
name = "usl-core"
version = "0.1.0"
edition = "2021"
description = "USL — Universal Session Log storage engine (schema-agnostic, append-only, crash-recoverable). Incubated inside the e workspace but designed as an independent crate: zero dependencies on e."
license = "MIT OR Apache-2.0"

[dependencies]
crc32fast = "1"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
