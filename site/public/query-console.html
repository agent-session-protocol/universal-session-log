<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USL Query Console</title>
  <style>
    :root { --bg:#f5f5f3; --panel:#fff; --ink:#171918; --muted:#6f746f; --line:#dedfda; --soft:#eceee9; --green:#176b45; --green2:#e0f1e7; --amber:#a46613; --blue:#365d85; --red:#a94442; }
    * { box-sizing:border-box } html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    body { display:grid; grid-template-columns:238px 1fr; min-height:100vh }
    aside { background:#1d211f; color:#f6f7f4; padding:22px 14px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh }
    .brand { display:flex; gap:11px; align-items:center; padding:0 9px 24px; font-weight:700; letter-spacing:-.02em }
    .mark { width:29px; height:29px; border-radius:9px; background:#68b88b; display:grid; place-items:center; color:#102b1f; font:800 12px ui-monospace,monospace }
    nav { display:grid; gap:4px } nav a { color:#b7bdb8; text-decoration:none; padding:10px 11px; border-radius:8px; display:flex; gap:10px; align-items:center; font-weight:550 }
    nav a:hover { background:#292e2b; color:#fff } nav a.on { background:#343a36; color:#fff; box-shadow:inset 2px 0 #68b88b }
    nav svg { width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8 }
    .side-foot { margin-top:auto; padding:15px 10px 3px; color:#88908a; font-size:11px; border-top:1px solid #323733 }
    .side-foot b { display:block; color:#c9cfca; margin-bottom:4px }
    main { min-width:0 }
    header { height:70px; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 32px; background:rgba(255,255,255,.82); backdrop-filter:blur(12px); position:sticky; top:0; z-index:3 }
    .crumb { color:var(--muted); font-size:13px }.crumb strong { color:var(--ink) }
    .header-actions { margin-left:auto; display:flex; align-items:center; gap:10px }
    .dot { width:8px;height:8px;border-radius:50%;background:#43a872;box-shadow:0 0 0 4px #e3f4e9 }.avatar { width:32px;height:32px;border-radius:50%;background:#d9dfd9;display:grid;place-items:center;font-weight:700;font-size:11px }
    .page { padding:30px 34px 44px; max-width:1480px; margin:auto }
    .page-head { display:flex; align-items:flex-end; gap:20px; margin-bottom:24px }.page-head h1 { margin:0;font-size:27px;letter-spacing:-.035em }.page-head p { margin:5px 0 0;color:var(--muted) }.page-head .actions { margin-left:auto }
    button,.button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:9px 13px; font-weight:650; font-size:12px }.primary { background:var(--green);color:#fff;border-color:var(--green) }
    .grid { display:grid;gap:16px }.stats { grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px }.two { grid-template-columns:1.35fr 1fr }.three { grid-template-columns:repeat(3,1fr) }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 1px rgba(20,25,22,.02); overflow:hidden }.pad { padding:18px }.card h2 { font-size:14px;margin:0 0 3px }.sub { color:var(--muted);font-size:12px }
    .stat .label { color:var(--muted);font-size:12px }.stat .value { font:700 26px/1.2 ui-monospace,SFMono-Regular,monospace;letter-spacing:-.04em;margin:9px 0 7px }.delta { color:var(--green);font-size:11px;font-weight:650 }.delta.neutral { color:var(--muted) }
    .card-head { min-height:57px;border-bottom:1px solid var(--line);padding:14px 17px;display:flex;align-items:center;gap:12px }.card-head .right { margin-left:auto }
    table { width:100%;border-collapse:collapse;font-size:12px } th { color:var(--muted);text-transform:uppercase;letter-spacing:.055em;font-size:9px;text-align:left;padding:10px 14px;background:#fafbf9;border-bottom:1px solid var(--line) } td { padding:12px 14px;border-bottom:1px solid #eceeea;white-space:nowrap } tr:last-child td { border-bottom:0 }.mono { font-family:ui-monospace,SFMono-Regular,monospace }.titlecell { white-space:normal;min-width:235px;font-weight:620 }
    .badge { display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 8px;background:var(--soft);color:#565d58;font-size:10px;font-weight:700 }.badge.green { background:var(--green2);color:var(--green) }.badge.amber { background:#fbefd9;color:var(--amber) }.badge.red { background:#f9e5e3;color:var(--red) }.badge.blue { background:#e8eff7;color:var(--blue) }
    .bar { height:7px;background:#ebede9;border-radius:9px;overflow:hidden }.bar i { display:block;height:100%;background:#5c9e79;border-radius:inherit }
    .chart { height:173px;display:flex;align-items:end;gap:8px;padding:20px 8px 4px }.chart i { flex:1;background:linear-gradient(#67ad85,#d8eadf);border-radius:4px 4px 1px 1px;min-width:8px }
    .legend { display:flex;justify-content:space-between;color:var(--muted);font-size:10px;padding:0 9px 4px }
    .feed { padding:2px 17px 13px }.event { display:grid;grid-template-columns:10px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #eceeea }.event:last-child { border:0 }.event .pin { width:7px;height:7px;margin-top:6px;border-radius:50%;background:#64a980 }.event strong { font-size:12px }.event p { margin:2px 0 0;color:var(--muted);font-size:11px }.time { color:#929892;font:10px ui-monospace,monospace }
    .filters { display:flex;gap:8px;margin-bottom:14px }.search { flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:#8c918d }.filter { min-width:130px }
    .query-layout { display:grid;grid-template-columns:minmax(440px,.9fr) minmax(500px,1.1fr);gap:16px }.editor { background:#171b19;color:#dce5df;min-height:280px;padding:19px;font:13px/1.75 ui-monospace,SFMono-Regular,monospace }.kw { color:#86d3a7 }.str { color:#e6c784 }.param { color:#91b9dd }.editor-top { background:#222724;color:#b8c1bb;border-bottom:1px solid #343a36;padding:10px 16px;font-size:11px;display:flex }.editor-top span:last-child { margin-left:auto;color:#6f7872 }
    .explain { display:grid;grid-template-columns:23px 1fr;gap:0 11px;padding:16px }.step { display:contents }.step .n { width:23px;height:23px;border-radius:50%;background:#e4f1e9;color:var(--green);display:grid;place-items:center;font:700 10px ui-monospace,monospace;position:relative }.step:not(:last-child) .n:after { content:"";position:absolute;top:23px;bottom:-27px;left:11px;width:1px;background:#d9ded9 }.step .body { padding:1px 0 24px }.step .body b { font-size:12px }.step .body p { margin:3px 0;color:var(--muted);font-size:11px }
    .insight { padding:16px 17px;border-bottom:1px solid var(--line) }.insight:last-child{border:0}.insight-top {display:flex;gap:7px;align-items:center}.insight h3{font-size:13px;margin:9px 0 4px}.insight p{color:var(--muted);font-size:11px;margin:0 0 11px}.evidence{font:10px ui-monospace,monospace;color:#757c77}.confidence{margin-left:auto;font:700 11px ui-monospace,monospace}
    .stream { background:#141816;color:#cdd6d0;font:11px/1.55 ui-monospace,SFMono-Regular,monospace;padding:4px 17px 17px }.stream-row { display:grid;grid-template-columns:72px 62px 110px 1fr;gap:13px;border-bottom:1px solid #282e2a;padding:10px 0 }.stream-row:last-child{border:0}.stream .seq{color:#73947f}.stream .phase{color:#74c999}.stream .type{color:#e3c582}.stream .detail{color:#abb5ae}
    .manifest { padding:16px 17px;border-bottom:1px solid var(--line) }.manifest:last-child{border:0}.manifest-top{display:flex;align-items:center;gap:9px}.manifest h3{font-size:13px;margin:0}.manifest .gen{color:var(--muted);font:10px ui-monospace,monospace;margin-left:auto}.manifest .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:13px 0 10px;color:var(--muted);font-size:10px}.manifest .meta b{color:var(--ink);font-weight:650}
    .empty { padding:50px;text-align:center;color:var(--muted) }
    @media(max-width:1000px){body{grid-template-columns:72px 1fr}.brand span,nav a span,.side-foot{display:none}nav a{justify-content:center}.stats{grid-template-columns:repeat(2,1fr)}.query-layout,.two{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside>
    <div class="brand"><div class="mark">USL</div><span>Query Console</span></div>
    <nav id="nav"></nav>
    <div class="side-foot"><b>query.usl.dev/v1</b>ASP event 1.0 · projection 1.1</div>
  </aside>
  <main>
    <header><div class="crumb">USL / <strong id="crumb"></strong></div><div class="header-actions"><span class="dot"></span><span class="sub">All systems operational</span><div class="avatar">AK</div></div></header>
    <section class="page" id="page"></section>
  </main>
  <script>
    const icon = p => `<svg viewBox="0 0 24 24"><path d="${p}"/></svg>`;
    const views = [
      ["overview","Overview","M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"],
      ["sessions","Sessions","M4 6h16M4 12h16M4 18h16"],
      ["query","Query Explorer","M4 5h16v14H4zM8 9l3 3-3 3M13 15h3"],
      ["insights","Insights","M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3zM9 21h6"],
      ["audit","Live Audit","M4 12h3l2-6 4 12 2-6h5"],
      ["indexes","Indexes","M5 5c0-1.1 3.1-2 7-2s7 .9 7 2-3.1 2-7 2-7-.9-7-2zm0 0v6c0 1.1 3.1 2 7 2s7-.9 7-2V5m-14 6v6c0 1.1 3.1 2 7 2s7-.9 7-2v-6"],
    ];
    const q = new URLSearchParams(location.search); const active = views.some(v=>v[0]===q.get('view')) ? q.get('view') : 'overview';
    document.getElementById('nav').innerHTML = views.map(([id,label,path])=>`<a class="${id===active?'on':''}" href="?view=${id}">${icon(path)}<span>${label}</span></a>`).join('');
    const name = views.find(v=>v[0]===active)[1]; document.getElementById('crumb').textContent=name;
    const badge=(x,c='')=>`<span class="badge ${c}">${x}</span>`;
    const rows = [
      ['ses_9f2a','Repair auth token refresh race','Codex','1,248','2026-08-30 12:42','Active'],
      ['ses_71bd','Investigate checkout latency','Claude Code','884','2026-08-30 12:16','Active'],
      ['ses_42c1','Refactor event materializer','Pi','2,106','2026-08-30 11:58','Complete'],
      ['ses_1ea7','Audit production tool approvals','Codex','673','2026-08-30 10:31','Complete'],
      ['ses_c804','Migrate session evidence bundle','Dimagent','1,521','2026-08-30 09:47','Complete'],
    ];
    const head=(title,desc,action='')=>`<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${action?`<div class="actions">${action}</div>`:''}</div>`;
    const table=()=>`<div class="card"><table><thead><tr><th>Session</th><th>Runtime</th><th>Events</th><th>Last event</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="titlecell"><span class="mono sub">${r[0]}</span><br>${r[1]}</td><td>${badge(r[2],'blue')}</td><td class="mono">${r[3]}</td><td class="mono sub">${r[4]}</td><td>${badge(r[5],r[5]==='Active'?'green':'')}</td></tr>`).join('')}</tbody></table></div>`;
    const pages = {};
    pages.overview = head('Overview','A fixed-snapshot view of your Universal Session Log.') + `<div class="grid stats">${[['Committed sequence','184,291','+2,418 today'],['Canonical sessions','8,472','+86 this week'],['Indexed through','184,291','All indexes current'],['Active subscriptions','12','Within declared limits']].map((s,i)=>`<div class="card pad stat"><div class="label">${s[0]}</div><div class="value">${s[1]}</div><div class="delta ${i>1?'neutral':''}">${s[2]}</div></div>`).join('')}</div><div class="grid two"><div class="card"><div class="card-head"><div><h2>Append volume</h2><div class="sub">Canonical + Insight global sequence</div></div><div class="right">${badge('Last 24 hours')}</div></div><div class="chart">${[32,44,38,51,68,61,78,57,72,86,79,94,70,82,100,88,73,91,97,84,104,98,111,119].map(h=>`<i style="height:${h}px"></i>`).join('')}</div><div class="legend"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>Now</span></div></div><div class="card"><div class="card-head"><div><h2>Recent activity</h2><div class="sub">Across all visible streams</div></div></div><div class="feed">${[['Session imported','Codex · 303 messages · 91 tools','12:42'],['Vector generation published','gen_vec_20260830_4 · seq 184,291','12:39'],['Insight confirmed','Build failures correlate with stale lockfiles','12:31'],['Subscription resumed','audit-prod · cursor seq 184,104','12:26']].map(e=>`<div class="event"><i class="pin"></i><div><strong>${e[0]}</strong><p>${e[1]}</p></div><span class="time">${e[2]}</span></div>`).join('')}</div></div></div>`;
    pages.sessions = head('Sessions','Canonical sessions from every connected agent runtime.',`<button>Export</button> <button class="primary">Import session</button>`) + `<div class="filters"><div class="search">Search title, runtime, native ID…</div><button class="filter">Runtime: All</button><button class="filter">Status: All</button><button>As of seq 184,291</button></div>${table()}`;
    pages.query = head('Query Explorer','Write SessionQL, inspect its normalized plan, and keep the evidence.',`<button>Saved queries</button> <button class="primary">Run query</button>`) + `<div class="query-layout"><div class="card"><div class="editor-top"><span>SESSIONQL</span><span>⌘ ↵ to run</span></div><div class="editor"><span class="kw">from</span> sessions<br>| <span class="kw">search hybrid</span> <span class="param">$question</span> language <span class="str">"en"</span> top 3<br>| <span class="kw">where</span> provenance.runtime in <span class="param">$runtimes</span><br>| <span class="kw">project</span> sessionId, title,<br>&nbsp;&nbsp;search.hits, search.score<br>| <span class="kw">sort by</span> search.score desc, sessionId asc<br>| <span class="kw">limit</span> 20</div><div class="pad"><div class="sub">Parameters</div><p class="mono">question = "approval failures during deploy"<br>runtimes = ["codex", "claude"]</p></div></div><div class="card"><div class="card-head"><div><h2>Explain</h2><div class="sub">asOfSeq 184,291 · 38 ms · 6 rows</div></div><div class="right">${badge('Snapshot fixed','green')}</div></div><div class="explain">${[['Source · sessions','Structured generation gen_struct_14 · 8,472 input rows'],['Search · hybrid','Full-text + vector RRF; hitsPerSession 3 · 48 candidates'],['Filter · where','provenance.runtime ACL-safe predicate · 31 rows'],['Project + sort','Stable identity tie-break · 20 rows'],['Limit · 20','6 visible rows returned · no warnings']].map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div class="body"><b>${s[0]}</b><p>${s[1]}</p></div></div>`).join('')}</div></div></div>`;
    pages.insights = head('Insights','Derived statements stay separate from canonical facts.',`<button>Status: All</button> <button class="primary">Generate insight</button>`) + `<div class="grid two"><div class="card"><div class="card-head"><div><h2>Review queue</h2><div class="sub">Proposed insights require a decision</div></div>${badge('4 proposed','amber')}</div>${[['proposed','Build failures correlate with stale pnpm lockfiles',0.86,'12 evidence events · query 78c31a'],['confirmed','Tool approval latency is highest during deployment windows',0.93,'31 evidence events · query 44f02c'],['proposed','Three sessions share the same authentication regression',0.79,'9 evidence events · query c021db'],['superseded','Codex sessions fail more often than Pi sessions',0.62,'Superseded by revision 3']].map(x=>`<div class="insight"><div class="insight-top">${badge(x[0],x[0]==='confirmed'?'green':x[0]==='proposed'?'amber':'')}<span class="confidence">${Math.round(x[2]*100)}% confidence</span></div><h3>${x[1]}</h3><p>Produced by skill/session-patterns@1.4 · policy rp_7b41</p><span class="evidence">${x[3]}</span></div>`).join('')}</div><div class="grid"><div class="card pad"><h2>Insight lifecycle</h2><p class="sub">Append-only revisions keep every correction auditable.</p><div style="margin:22px 0 14px;display:flex;align-items:center;justify-content:space-between"><span class="badge amber">Proposed</span><span>→</span><span class="badge green">Confirmed</span><span>·</span><span class="badge red">Rejected</span><span>·</span><span class="badge">Superseded</span></div></div><div class="card pad"><h2>Provenance completeness</h2><p class="sub">Evidence, query hash, skill version, actor, and policy hash.</p><div class="value mono" style="font-size:28px;margin:19px 0 9px">100%</div><div class="bar"><i style="width:100%"></i></div></div></div></div>`;
    pages.audit = head('Live Audit','Replay and tail deterministic, bounded SessionQL subscriptions.',`<button>Pause stream</button> <button class="primary">New subscription</button>`) + `<div class="grid stats">${[['Delivery','At least once','Deduplicate by deliveryId'],['Current phase','Live','Replay completed at 184,120'],['Processed seq','184,291','Cursor safely persisted'],['Active rule','tool-approval-gap','match within 10m']].map((s,i)=>`<div class="card pad stat"><div class="label">${s[0]}</div><div class="value" style="font-size:${i===0?18:22}px">${s[1]}</div><div class="delta neutral">${s[2]}</div></div>`).join('')}</div><div class="card"><div class="card-head"><div><h2>Subscription stream</h2><div class="sub">from events | match tool.call then tool.result within 10m</div></div><div class="right">${badge('Live','green')}</div></div><div class="stream">${[['184291','live','tool.result','shell · success · ses_9f2a · 842ms'],['184290','live','message','assistant · ses_9f2a · 1,204 UTF-8 bytes'],['184289','live','approval.decided','allow · shell · actor user_47'],['184288','live','approval.requested','shell · npm test · ses_9f2a'],['184287','live','tool.call','shell · ses_9f2a · turn_08c'],['184286','live','message','user · ses_71bd · 382 UTF-8 bytes'],['184285','live','session.updated','claude · ses_71bd · active'],['184284','live','tool.result','read · success · ses_42c1 · 18ms']].map(r=>`<div class="stream-row"><span class="seq">${r[0]}</span><span class="phase">${r[1]}</span><span class="type">${r[2]}</span><span class="detail">${r[3]}</span></div>`).join('')}</div></div>`;
    pages.indexes = head('Indexes','Rebuildable sidecars pinned by immutable generation.',`<button>Capability manifest</button> <button class="primary">Rebuild index</button>`) + `<div class="grid two"><div class="card"><div class="card-head"><div><h2>Published generations</h2><div class="sub">All required indexes match the active policy</div></div>${badge('Healthy','green')}</div>${[['Structured','gen_struct_14','184,291','projection 1.1'],['Full text','gen_fts_21','184,291','chunker turn-768-v3'],['Vector','gen_vec_20260830_4','184,291','text-embedding-3-large · 3,072d'],['Lineage','gen_lineage_8','184,291','fork · resume · handoff · subagent'],['Analytics','gen_parquet_11','183,904','DuckDB / Parquet · read-only']].map((x,i)=>`<div class="manifest"><div class="manifest-top">${badge(x[0],i===4?'amber':'green')}<h3>${i===4?'Lagging by 387 records':'Published'}</h3><span class="gen">${x[1]}</span></div><div class="meta"><span>Built through <b>${x[2]}</b></span><span>Schema <b>${x[3]}</b></span></div><div class="bar"><i style="width:${i===4?'91':'100'}%"></i></div></div>`).join('')}</div><div class="grid"><div class="card pad"><h2>Snapshot decision</h2><p class="sub">A hybrid query requires structured, full-text, and vector indexes.</p><div style="font:700 31px ui-monospace,monospace;margin:22px 0 4px">184,291</div><div class="sub">selected asOfSeq · freshness: indexed</div></div><div class="card pad"><h2>Policy isolation</h2><p class="sub">Every active generation is bound to redaction policy hash.</p><p class="mono" style="margin:19px 0 8px">sha256:7b41d2…91ac</p>${badge('Policy match','green')}</div></div></div>`;
    document.getElementById('page').innerHTML = pages[active] || `<div class="empty">Page not found.</div>`;
  </script>
</body>
</html>
